# 清风娘·动态版 的动画合成配置：精灵图 → actions.png。
# 运行：python tools/sprites_to_apng.py sources/qingfeng-niang/sprites.toml -o themes/03-skin-animated/assets/actions.png

# 精灵图（每张 2×2，格子顺序：左上、右上、左下、右下 = 0、1、2、3）。
[sheets]
"01" = "sheets/sheet-01.png"  # 打字：双手在胸前的四种手势（本主题用于 typing）
"02" = "sheets/sheet-02.png"  # 眨眼：睁眼、半闭、闭眼、半闭（idle）
"03" = "sheets/sheet-03.png"  # 打字备选：手放低的四种（未使用；和 01 混排跳变大）
"04" = "sheets/sheet-04.png"  # 开心：笑、爱心（上屏）
"05" = "sheets/sheet-05.png"  # 疑惑：托下巴、问号（空码）
"06" = "sheets/sheet-06.png"  # 睡觉：趴在云上，Zz（长时间无操作）
"07" = "sheets/sheet-07.png"  # 看向一边（停手片刻）
"08" = "sheets/sheet-08.png"  # 欢呼：握拳、比 V（中英切换）
"09" = "sheets/sheet-09.png"  # 读书：戴眼镜翻书（翻页）
"10" = "sheets/sheet-10.png"  # 被戳：惊讶、><（点击）

[grid]
grid = 2                   # 每边几格
crop = [30, 9, 606, 578]   # 每格里的裁切框（左、上、右、下）：含左侧动效线与右侧特效，底边统一
scale = 0.75               # 裁切后缩放比例
alpha_low = 12             # alpha ≤ 此值当透明
alpha_high = 245           # alpha ≥ 此值当不透明

# 状态 → 帧序列：[精灵图, 格子, 毫秒]。状态之间的先后顺序就是它们在 APNG 里的先后顺序。
[states]
# 眨眼：睁眼停 2.6 秒，半闭→闭→半闭 共约 0.27 秒。节奏全在这里调。
idle = { frames = [["02", 0, 2600], ["02", 1, 80], ["02", 2, 110], ["02", 3, 80]] }
# 打字：四种手势按相邻差异最小的顺序循环（0→1→3→2）。
typing = { frames = [["01", 0, 200], ["01", 1, 200], ["01", 3, 200], ["01", 2, 200]] }
happy = { frames = [["04", 0, 100], ["04", 1, 110], ["04", 2, 130], ["04", 3, 130], ["04", 2, 110], ["04", 1, 110], ["04", 0, 100]] }
poke = { frames = [["10", 0, 100], ["10", 1, 130], ["10", 2, 170], ["10", 2, 170], ["10", 3, 130], ["10", 0, 100]] }
think = { frames = [["05", 0, 150], ["05", 1, 500], ["05", 2, 500], ["05", 3, 150]] }
sleep = { frames = [["06", 0, 700], ["06", 1, 700], ["06", 2, 700], ["06", 3, 700]] }
read = { frames = [["09", 0, 200], ["09", 1, 500], ["09", 2, 400], ["09", 3, 500]] }
cheer = { frames = [["08", 0, 120], ["08", 1, 300], ["08", 2, 300], ["08", 3, 150]] }
glance = { frames = [["07", 0, 120], ["07", 1, 500], ["07", 2, 500], ["07", 3, 120]] }
